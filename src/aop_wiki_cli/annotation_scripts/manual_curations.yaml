# =============================================================================
# Manual KE curations — applied BEFORE running annotate_ke.py
# =============================================================================
#
# WHY THIS FILE EXISTS
#   AOP-Wiki authors sometimes record KE titles that are wrong, unsupported, or
#   ambiguous. Rather than let the annotation scripts faithfully (mis)annotate
#   them, record the corrected value here. `apply_manual_curations.py` seeds
#   these into the shared store (outputs_for_vc/annotations/ke_annotations.json)
#   marked `source: manual_curation`; annotate_ke.py then treats them as
#   reference values and skips re-querying, so your corrections persist on every
#   future run.
#
# HOW TO RUN
#   uv run python annotation_scripts/apply_manual_curations.py --dry-run   # preview
#   uv run python annotation_scripts/apply_manual_curations.py             # apply
#   then run annotate_ke.py as usual.
#
# WHICH FIELDS CAN BE CURATED (only fields annotate_ke.py reads back from the store)
#   Top-level:
#     biological_organization   a level string: Molecular | Cellular | Tissue | Organ | Individual | Population
#     cell_term                 a CL term
#     organ_term                a UBERON term
#     cellular_component        a GO cellular_component term (subcellular structure /
#                               organelle, e.g. mitochondrion GO:0005739)
#   Per-subject (under `fields:` — applied to the KE's parsed subject phrase):
#     biological_object         protein/gene/chemical/anatomy object
#     biological_process        a GO process
#     phenotype                 a UPHENO/HP/MP phenotype
#   (biological_action is NOT curatable here — annotate_ke.py always recomputes
#    it from the title, so a value set here would be overwritten.)
#
# HOW TO SPECIFY A CORRECTED VALUE (per field, pick ONE):
#     curie:  PR:000011170           # exact ontology ID; pair with `label:` for a readable summary
#     label:  "..."                  # optional with curie; recommended
#   — or —
#     query:  "NRF2"                 # a phrase the applier resolves via BioPortal
#     ontologies: "PR,HGNC"          # optional; defaults to the field's normal ontology set
#   — or —
#     no_term: true                  # assert there is NO valid ontology term for this field
#     reason:  "..."                 # why (recommended)
#   — and for biological_organization only —
#     value:  "Molecular"            # the level string
#
# Optional per field:
#     subject: "NFE2/Nrf2 repression"  # which parsed subject this applies to;
#                                      # omit when the KE has a single subject.
#
# Always include a KE-level `rationale:` — it is written into the KE's comments
# as provenance for the correction.
# =============================================================================

curations:

  # KE 1417 — "NFE2/Nrf2 repression". Curator review: nothing in the KE content
  # substantiates NFE2; no references are cited. The object is NRF2 (NFE2L2).
  "1417":
    rationale: >-
      AOP-Wiki title pairs NFE2 with Nrf2, but the KE content cites no evidence
      or references for NFE2 (a distinct gene, HGNC:7780, from NFE2L2/NRF2).
      Curating the biological object as NRF2 (NFE2L2).
    fields:
      biological_object:
        curie: PR:000011170
        label: nuclear factor erythroid 2-related factor 2
        subject: "NFE2/Nrf2 repression"


  "458":
    rationale: >-
      Title "Increased, De Novo FA synthesis" breaks into: "Increased" = the
      action (recomputed from the title by annotate_ke.py); "De Novo FA
      synthesis" = the biological process; and the entity acted upon = fatty
      acid. "FA" is an abbreviation BioPortal does not resolve (a "De Novo FA
      synthesis" GO query returns unrelated terms like "de novo centriole
      assembly"), so both are pinned to their ontology terms directly:
      GO:0006633 fatty acid biosynthetic process (there is no distinct "de
      novo" GO child) and CHEBI:35366 fatty acid.
    fields:
      biological_process:
        curie: GO:0006633
        label: fatty acid biosynthetic process
      biological_object:
        curie: CHEBI:35366
        label: fatty acid
      phenotype:
        curie: MP:0020867
        label: increased lipogenesis

  # KE 459 — "Increase, Liver steatosis". Steatosis is a pathological state, not
  # a GO process, so "steatosis" has no GO term and a "liver steatosis" GO query
  # returns only liver morphogenesis/development terms (the annotator correctly
  # rejected them). The condition itself is captured as a phenotype (HP:0001397
  # Hepatic steatosis) by the normal pipeline. Here we pin the underlying
  # mechanistic process GO does model: lipid storage.
  "459":
    rationale: >-
      Steatosis is a phenotype (abnormal hepatic lipid accumulation), not a GO
      biological process, so no "steatosis" GO term exists and the automated
      process query returned only unrelated liver-development terms. Pinning the
      underlying GO process that produces the condition: lipid storage
      (GO:0019915). Object (liver) and phenotype (HP:0001397 hepatic steatosis)
      are left to the normal pipeline.
    fields:
      biological_process:
        curie: GO:0019915
        label: lipid storage

  # KE 451 — "Inhibition, Mitochondrial fatty acid beta-oxidation": no curation
  # needed. ke_title_parser now extracts the subcellular-location word
  # ("Mitochondrial" -> "mitochondrion") and the annotation workflow resolves
  # cellular_component to GO:0005739 automatically.

  # KE 878 — "Inhibition, SREBP1c". "SREBP1c" is a lab abbreviation BioPortal
  # does not match (0 hits); it is sterol regulatory element-binding protein 1.
  "878":
    rationale: >-
      "SREBP1c" is a lab abbreviation BioPortal does not resolve; it is sterol
      regulatory element-binding protein 1. Pinned to the species-neutral PR term.
    fields:
      biological_object:
        curie: PR:000015611
        label: sterol regulatory element-binding protein 1

  # KE 880 — "Increased, ApoB100". "ApoB100" is a lab abbreviation BioPortal
  # does not match (0 hits); it is apolipoprotein B-100.
  "880":
    rationale: >-
      "ApoB100" is a lab abbreviation BioPortal does not resolve; it is
      apolipoprotein B-100. Pinned to the species-neutral PR term.
    fields:
      biological_object:
        curie: PR:000004145
        label: apolipoprotein B-100

  "1458":
    rationale: >-
      "Pulmonary fibrosis" names the disease process, not the organ, so the
      UBERON search on the title phrase never surfaces "lung" and the ranker
      rejects every candidate (its rejection even names UBERON:0002048 as the
      correct term). A manually reviewed "lung" was lost to a --force run.
    fields:
      organ_term:
        curie: UBERON:0002048
        label: lung

  # ---------------------------------------------------------------------------
  # Examples of the other styles (remove or adapt). Commented out so they do not
  # apply. Copy a block up into `curations:` and edit.
  # ---------------------------------------------------------------------------
  #
  # "<ke_id>":
  #   rationale: "Title phrasing doesn't match any ontology term; resolved by phrase."
  #   fields:
  #     biological_object:
  #       query: "liver X receptor alpha"
  #       ontologies: "PR,HGNC"
  #
  # "<ke_id>":
  #   rationale: "Author outcome has no valid ontology representation."
  #   fields:
  #     phenotype:
  #       no_term: true
  #       reason: "Composite clinical description with no single HP/MP/UPHENO term."
  #     biological_organization:
  #       value: "Molecular"
