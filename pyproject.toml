[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aop-wiki-cli"
version = "0.1.0"
description = "A CLI tool that extracts AOP entities from the AOP-Wiki XML and applies filtering and processing operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "typer>=0.21.0",
    "pyyaml>=6.0",
    # Pinned to a commit because the schema is still being revised; bump it
    # deliberately and rerun the tests when it changes.
    "linkml-aop @ git+https://github.com/EHS-Data-Standards/linkml-aop@11e16e4e283d90e6f445e2ea57a29778900cda8a",
    # Used only by the opt-in LLM review (analysis/event_level_llm_review.py);
    # the deterministic checks import nothing from it.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aop-wiki-cli = "aop_wiki_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aop_wiki_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/aop_wiki_cli", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
