[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aop-wiki-cli"
version = "0.1.0"
description = "A CLI tool that extracts AOP entities from the AOP-Wiki XML and applies filtering and processing operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "typer>=0.21.0",
    "pyyaml>=6.0",
    # Pinned to a commit because the schema is still being revised; bump it
    # deliberately and rerun the tests when it changes.
    "linkml-aop @ git+https://github.com/EHS-Data-Standards/linkml-aop@11e16e4e283d90e6f445e2ea57a29778900cda8a",
    # Used only by the opt-in LLM review (analysis/event_level_llm_review.py);
    # the deterministic checks import nothing from it.
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
aop-wiki-cli = "aop_wiki_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aop_wiki_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/aop_wiki_cli", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aop_wiki_cli"]
# Single-use scripts developed to process one specific input and not meant for
# reuse (the seizure pipeline driven by `collect-harmonized-seizure-aops`), plus
# code that is not wired into any command: the reference-search driver (see the
# `TODO: Add search reference functionality` in cli.py) and the orphaned
# title-stripper (`*_unused.py`). Excluded so coverage reflects the reusable
# library. See issue #25 and the follow-up #28.
#
# `manual_match_review.py` is excluded too: although it also backs the
# `manually-review-matches` command, its logic is an interactive stdin review
# loop (part of the manual harmonization workflow), not reusable library code.
omit = [
    "*/parsers/parse_behl_seizure_aop_workbook.py",
    "*/parsers/aop_wiki_content_parsers_unused.py",
    "*/data_export/seizure_aop_export.py",
    "*/analysis/analyze_seizure_aop_content.py",
    "*/analysis/map_ke_descriptions_to_harmonized.py",
    "*/analysis/manual_match_review.py",
    "*/search/aop_wiki_xml_ref_search.py",
]

[tool.hatch.metadata]
allow-direct-references = true
