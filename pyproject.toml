[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aop-wiki-cli"
version = "0.1.0"
description = "A CLI tool that extracts AOP entities from the AOP-Wiki XML and applies filtering and processing operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "typer>=0.21.0",
    "pyyaml>=6.0",
    # Pinned to a commit because the schema is still being revised; bump it
    # deliberately and rerun the tests when it changes.
    "linkml-aop @ git+https://github.com/EHS-Data-Standards/linkml-aop@11e16e4e283d90e6f445e2ea57a29778900cda8a",
    "python-dotenv>=1.2.2",
    # Used only by the opt-in LLM review (analysis/event_level_llm_review.py);
    # the deterministic checks import nothing from it.
    "anthropic>=0.50"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Opt-in group for annotation_scripts/validate_annotations.py (OAK-backed
# ontology checks); heavy, so not part of the default install:
#   uv run --group validation python -m aop_wiki_cli.annotation_scripts.validate_annotations
validation = [
    "oaklib>=0.6.15",
]

[project.scripts]
aop-wiki-cli = "aop_wiki_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aop_wiki_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/aop_wiki_cli", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aop_wiki_cli"]
# Coverage is measured against the reusable library that the CLI commands
# actually run. Excluded below (so the figure is not diluted by code nothing
# calls): code wired into no command, and orphaned files. See issue #25 and
# the follow-up #28.
#
# The single-use seizure pipeline (the Behl workbook parser, its citation
# parser, the seizure exporter/analysis/mapping and the interactive match
# review) no longer appears here: per #28 it has been relocated out of the
# package into scripts/seizure_aops/, so it is not part of the measured source
# at all. The reusable harmonization-sheet core it still shares with the
# general search-within-aops command stays in the library as
# parsers/seizure_harmonization.py and is covered by tests.
#
# Not wired into any command: the reference-search subsystem. `cli.py` only
# references it in the `TODO: Add search reference functionality` comment; the
# driver, the search module and the citation parser are reached by no live
# command (search_references/parse_references are re-exported from their
# packages' __init__ but consumed nowhere live). The one exception is
# `data_export/export_reference_search_results.py`: it belongs to the same
# subsystem but is deliberately left in the denominator because this suite
# covers it (it is pure, testable JSON/CSV writing), so it is not listed below.
#
# Orphaned (renamed with the `*_unused.py` suffix, no longer re-exported): the
# title-stripper and the one-off HTML-to-CSV converter. `__main__.py` is the
# `python -m` entry point.
# The KE annotation subpackage (annotation_scripts/) is interactive LLM/BioPortal
# tooling run as standalone modules, not wired into any CLI command, so by the
# same rule it stays out of the denominator — except its two pure parsing
# modules (ke_title_parser, query_bioportal), which the suite covers directly.
# The pure helpers of annotate_ke, apply_manual_curations and
# report_annotation_coverage are tested too, but those files are dominated by
# interactive orchestration, so they are omitted rather than diluting the figure.
omit = [
    # not-wired reference-search subsystem
    "*/search/aop_wiki_xml_ref_search.py",
    "*/search/search_references.py",
    "*/parsers/parse_references.py",
    # orphaned / entry point
    "*/parsers/aop_wiki_content_parsers_unused.py",
    "*/utilities/html_to_csv_converter_unused.py",
    "*/__main__.py",
    # interactive KE annotation tooling (see note above)
    "*/annotation_scripts/__init__.py",
    "*/annotation_scripts/annotate_ke.py",
    "*/annotation_scripts/annotate_liver_microphys_data.py",
    "*/annotation_scripts/annotate_term_helpers.py",
    "*/annotation_scripts/apply_manual_curations.py",
    "*/annotation_scripts/assay_extraction.py",
    "*/annotation_scripts/compare_ke_annotations.py",
    "*/annotation_scripts/export_assays_to_csv.py",
    "*/annotation_scripts/llm.py",
    "*/annotation_scripts/process_manual_curations.py",
    "*/annotation_scripts/prompts.py",
    "*/annotation_scripts/report_annotation_coverage.py",
    "*/annotation_scripts/store.py",
    "*/annotation_scripts/summarize_annotations.py",
    "*/annotation_scripts/validate_annotations.py",
]

[tool.hatch.metadata]
allow-direct-references = true
