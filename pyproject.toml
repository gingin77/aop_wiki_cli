[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aop-wiki-cli"
version = "0.1.0"
description = "A CLI tool that extracts AOP entities from the AOP-Wiki XML and applies filtering and processing operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "typer>=0.21.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aop-wiki-cli = "aop_wiki_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aop_wiki_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/aop_wiki_cli", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
