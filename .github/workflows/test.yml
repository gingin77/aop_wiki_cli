name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs Python 3.13 (per .python-version / requires-python) and all
      # dependencies, including the linkml-aop git pin fetched from GitHub.
      # --locked fails the run if uv.lock is stale rather than silently
      # re-resolving, so CI never goes green against a rewritten lockfile.
      - name: Install dependencies
        run: uv sync --locked

      # Coverage is reported on every run and ratcheted with --cov-fail-under so
      # it cannot silently drop. The floor sits just under the current level;
      # raising coverage (and the floor) on the untested modules is tracked
      # separately.
      - name: Run tests
        run: >
          uv run pytest
          --cov=aop_wiki_cli
          --cov-report=term-missing
          --cov-fail-under=66
