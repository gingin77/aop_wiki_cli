name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Installs Python 3.13 (per .python-version / requires-python) and all
      # dependencies, including the linkml-aop git pin fetched from GitHub.
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
