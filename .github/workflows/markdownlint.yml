name: markdownlint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # markdownlint-cli auto-discovers .markdownlint.json (MD013 at 120 chars,
      # relaxed for code blocks and tables). Pinned to the classic CLI rather
      # than markdownlint-cli2, whose newer default rules flag the existing docs.
      - name: Run markdownlint
        run: >
          npx --yes markdownlint-cli@0.45.0
          "README.md"
          "docs/**/*.md"
          "src/aop_wiki_cli/configs/Configs_README.md"
